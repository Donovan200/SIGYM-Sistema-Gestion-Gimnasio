<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>SIGYM - Usuario</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

<div class="header">
    <h1>SIGYM</h1>
</div>

<div class="container">

    <h2 th:text="${usuario.idUsuario == null}
            ? 'Nuevo usuario'
            : 'Editar usuario'">
    </h2>

    <form th:action="${usuario.idUsuario == null}
            ? @{/web/usuarios/guardar}
            : @{/web/usuarios/actualizar/{id}
                (id=${usuario.idUsuario})}"
          th:object="${usuario}"
          method="post">

        <div class="form-group">
            <label>Usuario:</label>

            <input type="text"
                   th:field="*{username}"
                   maxlength="50"
                   required>
        </div>

        <div class="form-group">
            <label>Contraseña:</label>

            <input type="password"
                   th:field="*{password}"
                   th:required="${usuario.idUsuario == null}">

            <p th:if="${usuario.idUsuario != null}">
                Déjala vacía para conservar la contraseña actual.
            </p>
        </div>

        <div class="form-group">
            <label>Rol:</label>

            <select th:field="*{rol}" required>

                <option value="USER">
                    USER
                </option>

                <option value="ADMIN">
                    ADMIN
                </option>

            </select>
        </div>

        <div class="form-group">
            <label>Activo:</label>

            <select th:field="*{activo}" required>

                <option value="true">
                    Sí
                </option>

                <option value="false">
                    No
                </option>

            </select>
        </div>

        <div class="actions">

            <button type="submit"
                    class="btn"
                    th:text="${usuario.idUsuario == null}
                        ? 'Guardar'
                        : 'Actualizar'">
                Guardar
            </button>

            <a href="/web/usuarios"
               class="btn btn-secondary">
                Cancelar
            </a>

        </div>

    </form>

</div>

</body>
</html>
